<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Valid Entries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #f0f5fa;
  --surface:  #ffffff;
  --surface2: #eaf1f8;
  --border:   #d0dce8;
  --accent:   #2f4157;
  --accent2:  #6385a2;
  --text:     #2f4157;
  --muted:    #6385a2;
  --label:    #4a6278;
  --win:      #1e6b3a;
  --win-bg:   #e6f4ea;
  --loss:     #b31412;
  --loss-bg:  #fce8e6;
  --warn:     #d97706;
  --danger:   #b31412;
  --radius:   6px;
  --font:     'Poppins', sans-serif;
}
body.dark {
  --bg:       #0f1923;
  --surface:  #1a2535;
  --surface2: #212f42;
  --border:   #2e3f54;
  --accent:   #1e2d3d;
  --accent2:  #6385a2;
  --text:     #dde6f0;
  --muted:    #7a97b0;
  --label:    #9ab0c4;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; min-height: 100vh; }

/* ── Header ── */
.app-header {
  background: var(--accent); padding: 14px 16px 12px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.app-title { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
.hamburger {
  background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
  border-radius: 6px; color: #fff; padding: 6px 10px; font-size: 18px;
  cursor: pointer; line-height: 1;
}

/* ── Slide Menu ── */
.slide-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  z-index: 300; opacity: 0; pointer-events: none; transition: opacity 0.25s;
}
.slide-overlay.open { opacity: 1; pointer-events: all; }
.slide-menu {
  position: fixed; top: 0; left: -280px; bottom: 0; width: 280px;
  background: var(--surface); z-index: 301;
  transition: left 0.25s ease; display: flex; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom);
}
.slide-menu.open { left: 0; }
.slide-menu-header {
  background: var(--accent); padding: 20px 16px 16px;
  display: flex; align-items: center; justify-content: space-between;
}
.slide-menu-title { font-size: 18px; font-weight: 700; color: #fff; }
.slide-close { background: none; border: none; color: rgba(255,255,255,0.7); font-size: 22px; cursor: pointer; }
.slide-menu-body { flex: 1; padding: 20px 16px; overflow-y: auto; }
.slide-section-label {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 1px; color: var(--muted); margin-bottom: 12px;
}
.slide-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0; border-bottom: 1px solid var(--border); cursor: pointer;
}
.slide-item:last-child { border-bottom: none; }
.slide-item-label { font-size: 15px; font-weight: 500; color: var(--text); }
.toggle { position: relative; width: 44px; height: 26px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-slider {
  position: absolute; inset: 0; background: var(--border);
  border-radius: 13px; cursor: pointer; transition: background 0.2s;
}
.toggle-slider::before {
  content: ''; position: absolute; width: 20px; height: 20px;
  left: 3px; top: 3px; background: var(--muted);
  border-radius: 50%; transition: transform 0.2s, background 0.2s;
}
.toggle input:checked + .toggle-slider { background: var(--accent2); }
.toggle input:checked + .toggle-slider::before { transform: translateX(18px); background: white; }

/* ── Content ── */
.content { padding: 16px; max-width: 680px; margin: 0 auto; }

/* ── Threshold card ── */
.threshold-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 16px 18px; margin-bottom: 16px;
}
.threshold-title {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.8px; color: var(--muted); margin-bottom: 14px;
}
.threshold-row { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
.threshold-field { display: flex; flex-direction: column; gap: 5px; }
.threshold-label {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.6px; color: var(--label);
}
.threshold-input-wrap { display: flex; align-items: center; gap: 6px; }
.threshold-input {
  width: 72px; background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text); font-family: var(--font);
  font-size: 15px; font-weight: 600; padding: 8px 10px; outline: none;
  text-align: center; transition: border-color 0.2s;
}
.threshold-input:focus { border-color: var(--accent2); }
.threshold-pct { font-size: 14px; color: var(--muted); }
.threshold-preview {
  display: flex; gap: 6px; align-items: center; margin-left: auto;
  flex-wrap: wrap;
}
.threshold-chip {
  border-radius: 4px; padding: 4px 10px; font-size: 12px; font-weight: 600;
}
.chip-green { background: var(--win-bg); color: var(--win); }
.chip-orange { background: #fef3c7; color: #92400e; }
.chip-red { background: var(--loss-bg); color: var(--loss); }
.threshold-save-btn {
  background: var(--accent2); border: 2px solid var(--accent); border-radius: var(--radius);
  color: #fff; font-family: var(--font); font-size: 13px; font-weight: 600;
  padding: 8px 18px; cursor: pointer; transition: background 0.15s; white-space: nowrap;
}
.threshold-save-btn:hover { background: var(--accent); }

/* ── Entry cards grid ── */
.cards-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
}
.entry-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 16px;
}
.entry-card-title {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.8px; color: var(--muted); margin-bottom: 12px;
  display: flex; align-items: center; justify-content: space-between;
}
.entry-count {
  background: var(--surface2); border-radius: 10px; padding: 1px 8px;
  font-size: 11px; color: var(--muted); font-weight: 500;
}
.entry-list { list-style: none; margin-bottom: 12px; }
.entry-item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 0; border-bottom: 1px solid var(--border);
}
.entry-item:last-child { border-bottom: none; }
.entry-value {
  flex: 1; font-size: 13px; font-weight: 500; color: var(--text);
  cursor: pointer; padding: 2px 4px; border-radius: 4px;
  border: 1px solid transparent; transition: border-color 0.15s, background 0.15s;
  background: none; font-family: var(--font); outline: none;
}
.entry-value:hover { background: var(--surface2); border-color: var(--border); }
.entry-value:focus { background: var(--surface2); border-color: var(--accent2); }
.entry-value.editing { border-color: var(--accent2); background: var(--surface2); }
.save-inline-btn {
  background: var(--win-bg); border: 1px solid var(--win); border-radius: 4px;
  color: var(--win); font-family: var(--font); font-size: 11px; font-weight: 600;
  padding: 2px 8px; cursor: pointer; display: none; white-space: nowrap;
}
.entry-item.has-changes .save-inline-btn { display: block; }
.delete-entry-btn {
  background: none; border: none; color: var(--muted); font-size: 15px;
  cursor: pointer; padding: 2px 4px; border-radius: 4px; line-height: 1;
  transition: color 0.15s, background 0.15s; flex-shrink: 0;
}
.delete-entry-btn:hover { color: var(--danger); background: var(--loss-bg); }

/* ── Add new entry row ── */
.add-row { display: flex; gap: 8px; margin-top: 4px; }
.add-input {
  flex: 1; background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text); font-family: var(--font);
  font-size: 13px; padding: 7px 10px; outline: none; transition: border-color 0.2s;
}
.add-input:focus { border-color: var(--accent2); }
.add-btn {
  background: var(--accent2); border: 2px solid var(--accent); border-radius: var(--radius);
  color: #fff; font-family: var(--font); font-size: 13px; font-weight: 600;
  padding: 7px 14px; cursor: pointer; white-space: nowrap; transition: background 0.15s;
}
.add-btn:hover { background: var(--accent); }

/* ── Confirm modal ── */
.confirm-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 500;
  display: flex; align-items: center; justify-content: center; padding: 16px;
  opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.confirm-overlay.visible { opacity: 1; pointer-events: all; }
.confirm-box {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 24px; max-width: 400px; width: 100%;
}
.confirm-title { font-size: 16px; font-weight: 700; margin-bottom: 10px; }
.confirm-body { font-size: 13px; color: var(--label); line-height: 1.6; margin-bottom: 20px; }
.confirm-body strong { color: var(--text); }
.confirm-actions { display: flex; gap: 10px; justify-content: flex-end; }
.btn-ghost {
  background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius);
  color: var(--label); font-family: var(--font); font-size: 13px; font-weight: 600;
  padding: 8px 16px; cursor: pointer; transition: background 0.15s;
}
.btn-ghost:hover { background: var(--border); }
.btn-danger {
  background: var(--loss-bg); color: var(--loss); border: 2px solid var(--loss);
  border-radius: var(--radius); font-family: var(--font); font-size: 13px;
  font-weight: 600; padding: 8px 16px; cursor: pointer; transition: all 0.15s;
}
.btn-danger:hover { background: var(--loss); color: #fff; }
.btn-primary {
  background: var(--accent2); color: #fff; border: 2px solid var(--accent);
  border-radius: var(--radius); font-family: var(--font); font-size: 13px;
  font-weight: 600; padding: 8px 16px; cursor: pointer; transition: background 0.15s;
}
.btn-primary:hover { background: var(--accent); }

/* ── Toast ── */
.toast {
  position: fixed; bottom: 20px; right: 20px; background: var(--accent);
  color: #fff; border-radius: 8px; padding: 11px 18px; font-size: 13px;
  font-weight: 500; z-index: 700; transform: translateY(80px); opacity: 0;
  transition: all 0.3s; pointer-events: none;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.error { background: var(--danger); }

/* ── Spinner ── */
.spinner-wrap { text-align: center; padding: 48px 16px; color: var(--muted); }
.spinner {
  display: inline-block; width: 28px; height: 28px;
  border: 3px solid var(--border); border-top-color: var(--accent2);
  border-radius: 50%; animation: spin 0.7s linear infinite; margin-bottom: 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.hidden { display: none !important; }

/* ── Setup ── */
.setup-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 28px; text-align: center; margin-top: 24px;
}
.setup-icon { font-size: 40px; margin-bottom: 14px; }
.setup-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
.setup-desc { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 20px; }
.setup-input {
  width: 100%; background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text); font-family: var(--font);
  font-size: 13px; padding: 10px 12px; outline: none; margin-bottom: 12px;
}
.setup-input:focus { border-color: var(--accent2); }
</style>
</head>
<body>

<!-- ── Slide menu ── -->
<div class="slide-overlay" id="slide-overlay" onclick="closeMenu()"></div>
<div class="slide-menu" id="slide-menu">
  <div class="slide-menu-header">
    <span class="slide-menu-title">MATCH TRACKER</span>
    <button class="slide-close" onclick="closeMenu()">✕</button>
  </div>
  <div class="slide-menu-body">
    <div class="slide-section-label">Appearance</div>
    <div class="slide-item" onclick="void(0)" style="cursor:default">
      <div class="slide-item-label">Dark Mode</div>
      <label class="toggle">
        <input type="checkbox" id="dark-toggle" onchange="toggleDark()">
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div style="height:20px"></div>
    <div class="slide-section-label">Navigation</div>
    <div class="slide-item" onclick="window.location='index.html'">
      <div class="slide-item-label">🎾 Match Entry</div>
    </div>
    <div class="slide-item" onclick="window.location='match-history.html'">
      <div class="slide-item-label">📋 Match History</div>
    </div>
    <div class="slide-item" onclick="window.location='desktop.html'">
      <div class="slide-item-label">📊 Dashboard</div>
    </div>
    <div class="slide-item" onclick="window.location='valid-entries.html'" style="color:var(--accent2)">
      <div class="slide-item-label" style="color:var(--accent2)">⚙️ Valid Entries</div>
    </div>
  </div>
</div>

<!-- ── Header ── -->
<div class="app-header">
  <button class="hamburger" onclick="openMenu()">☰</button>
  <span class="app-title">VALID ENTRIES</span>
  <div style="width:42px"></div>
</div>

<!-- ── Confirm modals ── -->
<div class="confirm-overlay" id="confirm-delete">
  <div class="confirm-box">
    <div class="confirm-title" style="color:var(--danger)">🗑 Delete Entry?</div>
    <div class="confirm-body" id="confirm-delete-body"></div>
    <div class="confirm-actions">
      <button class="btn-ghost" onclick="closeConfirm('confirm-delete')">Cancel</button>
      <button class="btn-danger" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<div class="confirm-overlay" id="confirm-rename">
  <div class="confirm-box">
    <div class="confirm-title">✏️ Rename Entry?</div>
    <div class="confirm-body" id="confirm-rename-body"></div>
    <div class="confirm-actions">
      <button class="btn-ghost" onclick="cancelRename()">Cancel</button>
      <button class="btn-primary" onclick="confirmRename()">Update</button>
    </div>
  </div>
</div>

<!-- ── Toast ── -->
<div class="toast" id="toast"></div>

<!-- ── Content ── -->
<div class="content" id="content">
  <div class="spinner-wrap"><div class="spinner"></div><div>Loading…</div></div>
</div>

<script>
// ── State ──────────────────────────────────────────────────
let webAppUrl    = '';
let entries      = {};
let thresholds   = { great: 55, poor: 45 };
let pendingDelete = null; // { field, value }
let pendingRename = null; // { field, oldValue, newValue, inputEl }

const FIELD_LABELS = {
  partner:      'Partners',
  season:       'Seasons',
  league:       'Leagues',
  level:        'Levels',
  type:         'Match Types',
  line:         'Lines',
  homeaway:     'Home / Away',
  surface:      'Surfaces',
  time:         'Time of Day',
  playoffround: 'Playoff Rounds'
};

const FIELD_ORDER = [
  'partner','season','league','level','type',
  'line','homeaway','surface','time','playoffround'
];

// ── Init ───────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  if (localStorage.getItem('darkMode') === 'true') {
    document.body.classList.add('dark');
    document.getElementById('dark-toggle').checked = true;
  }
  webAppUrl = localStorage.getItem('webAppUrl') || '';
  if (webAppUrl) loadData();
  else showSetup();
});

function toggleDark() {
  const on = document.getElementById('dark-toggle').checked;
  document.body.classList.toggle('dark', on);
  localStorage.setItem('darkMode', on);
}

function openMenu()  { document.getElementById('slide-menu').classList.add('open'); document.getElementById('slide-overlay').classList.add('open'); }
function closeMenu() { document.getElementById('slide-menu').classList.remove('open'); document.getElementById('slide-overlay').classList.remove('open'); }

// ── Setup ──────────────────────────────────────────────────
function showSetup() {
  document.getElementById('content').innerHTML = `
    <div class="setup-card">
      <div class="setup-icon">⚙️</div>
      <div class="setup-title">Connect to Your Sheet</div>
      <div class="setup-desc">Paste your Google Apps Script Web App URL to manage your valid entries.</div>
      <input type="url" class="setup-input" id="setup-url" placeholder="https://script.google.com/macros/s/...">
      <button class="btn-primary" style="width:100%;padding:11px" onclick="connectFromSetup()">Connect</button>
    </div>
  `;
}

function connectFromSetup() {
  const url = document.getElementById('setup-url').value.trim();
  if (!url || !url.includes('script.google.com')) { showToast('Please enter a valid Apps Script URL', true); return; }
  webAppUrl = url;
  localStorage.setItem('webAppUrl', webAppUrl);
  loadData();
}

// ── Load ───────────────────────────────────────────────────
async function loadData() {
  document.getElementById('content').innerHTML = `<div class="spinner-wrap"><div class="spinner"></div><div>Loading valid entries…</div></div>`;
  try {
    const res  = await fetch(`${webAppUrl}?action=getValidEntries`);
    const data = await res.json();
    if (!data.success) throw new Error(data.error);
    entries    = data.entries;
    thresholds = data.thresholds;
    // Sync thresholds to localStorage for dashboard use
    localStorage.setItem('thresholdGreat', thresholds.great);
    localStorage.setItem('thresholdPoor',  thresholds.poor);
    render();
  } catch(e) {
    document.getElementById('content').innerHTML = `<div class="spinner-wrap" style="color:var(--danger)">Failed to load. <button class="btn-ghost" onclick="loadData()" style="margin-top:12px">Retry</button></div>`;
  }
}

// ── Render ─────────────────────────────────────────────────
function render() {
  const great = thresholds.great;
  const poor  = thresholds.poor;
  const mid1  = poor;
  const mid2  = great;

  const cardsHtml = FIELD_ORDER.map(field => {
    const vals = entries[field] || [];
    const items = vals.map((v,i) => `
      <li class="entry-item" id="item-${field}-${i}">
        <input class="entry-value" type="text" value="${escHtml(v)}"
          data-original="${escHtml(v)}" data-field="${field}"
          oninput="onEntryInput(this, '${field}', ${i})"
          onblur="onEntryBlur(this, '${field}', ${i})">
        <button class="save-inline-btn" id="save-${field}-${i}"
          onclick="triggerRename('${field}', ${i})">Save</button>
        <button class="delete-entry-btn" title="Delete"
          onclick="triggerDelete('${field}', '${escHtml(v)}')">✕</button>
      </li>`).join('');

    return `
      <div class="entry-card">
        <div class="entry-card-title">
          ${FIELD_LABELS[field]}
          <span class="entry-count">${vals.length}</span>
        </div>
        <ul class="entry-list" id="list-${field}">${items || '<li style="font-size:12px;color:var(--muted);padding:6px 0">No entries yet</li>'}</ul>
        <div class="add-row">
          <input type="text" class="add-input" id="add-input-${field}" placeholder="Add new…"
            onkeydown="if(event.key==='Enter') addEntry('${field}')">
          <button class="add-btn" onclick="addEntry('${field}')">+ Add</button>
        </div>
      </div>`;
  }).join('');

  document.getElementById('content').innerHTML = `
    <div class="threshold-card">
      <div class="threshold-title">Performance Thresholds</div>
      <div class="threshold-row">
        <div class="threshold-field">
          <div class="threshold-label" style="color:var(--win)">Great (Green) ≥</div>
          <div class="threshold-input-wrap">
            <input type="number" class="threshold-input" id="t-great"
              value="${great}" min="0" max="100" oninput="updateThresholdPreview()">
            <span class="threshold-pct">%</span>
          </div>
        </div>
        <div class="threshold-field">
          <div class="threshold-label" style="color:var(--danger)">Poor (Red) ≤</div>
          <div class="threshold-input-wrap">
            <input type="number" class="threshold-input" id="t-poor"
              value="${poor}" min="0" max="100" oninput="updateThresholdPreview()">
            <span class="threshold-pct">%</span>
          </div>
        </div>
        <div class="threshold-preview" id="t-preview">
          <span class="threshold-chip chip-green">≥ ${great}%</span>
          <span class="threshold-chip chip-orange">${poor}–${great}%</span>
          <span class="threshold-chip chip-red">≤ ${poor}%</span>
        </div>
        <button class="threshold-save-btn" onclick="saveThresholds()">Save</button>
      </div>
    </div>
    <div class="cards-grid">${cardsHtml}</div>
  `;
}

function updateThresholdPreview() {
  const g = parseInt(document.getElementById('t-great').value) || 55;
  const p = parseInt(document.getElementById('t-poor').value)  || 45;
  document.getElementById('t-preview').innerHTML = `
    <span class="threshold-chip chip-green">≥ ${g}%</span>
    <span class="threshold-chip chip-orange">${p}–${g}%</span>
    <span class="threshold-chip chip-red">≤ ${p}%</span>
  `;
}

// ── Thresholds ─────────────────────────────────────────────
async function saveThresholds() {
  const great = parseInt(document.getElementById('t-great').value);
  const poor  = parseInt(document.getElementById('t-poor').value);
  if (isNaN(great) || isNaN(poor)) { showToast('Please enter valid numbers', true); return; }
  if (great <= poor) { showToast('Great threshold must be higher than Poor', true); return; }
  try {
    const res  = await fetch(webAppUrl, { method:'POST', body: JSON.stringify({ action:'updateThresholds', great, poor }) });
    const data = await res.json();
    if (!data.success) throw new Error(data.error);
    thresholds = { great, poor };
    localStorage.setItem('thresholdGreat', great);
    localStorage.setItem('thresholdPoor',  poor);
    showToast('Thresholds saved');
  } catch(e) { showToast('Failed to save: ' + e.message, true); }
}

// ── Add entry ──────────────────────────────────────────────
async function addEntry(field) {
  const input = document.getElementById('add-input-' + field);
  const value = input.value.trim();
  if (!value) return;
  if ((entries[field] || []).includes(value)) { showToast('That value already exists', true); return; }
  try {
    const res  = await fetch(webAppUrl, { method:'POST', body: JSON.stringify({ action:'addValidEntries', newEntries: { [field]: value } }) });
    const data = await res.json();
    if (!data.success) throw new Error(data.error);
    if (!entries[field]) entries[field] = [];
    entries[field].push(value);
    input.value = '';
    render();
    showToast(`Added "${value}"`);
  } catch(e) { showToast('Failed to add: ' + e.message, true); }
}

// ── Inline rename ──────────────────────────────────────────
function onEntryInput(inputEl, field, idx) {
  const original = inputEl.dataset.original;
  const current  = inputEl.value.trim();
  const item = document.getElementById(`item-${field}-${idx}`);
  if (current !== original && current !== '') {
    item.classList.add('has-changes');
  } else {
    item.classList.remove('has-changes');
  }
}

function onEntryBlur(inputEl, field, idx) {
  // Small delay to allow save button click to register
  setTimeout(() => {
    const original = inputEl.dataset.original;
    if (inputEl.value.trim() === '' || inputEl.value.trim() === original) {
      inputEl.value = original;
      document.getElementById(`item-${field}-${idx}`)?.classList.remove('has-changes');
    }
  }, 200);
}

async function triggerRename(field, idx) {
  const input    = document.querySelector(`#item-${field}-${idx} .entry-value`);
  const oldValue = input.dataset.original;
  const newValue = input.value.trim();
  if (!newValue || newValue === oldValue) return;

  // Count how many matches use this value
  let matchCount = 0;
  try {
    const res  = await fetch(`${webAppUrl}?action=getMatchHistory`);
    const data = await res.json();
    if (data.success) {
      const logColMap = {
        season:'season', league:'league', level:'level', type:'type',
        line:'line', homeaway:'homeaway', surface:'surface', time:'time',
        playoffround:'playoffround', partner:'partner'
      };
      const key = logColMap[field];
      if (key) matchCount = data.matches.filter(m => m[key] === oldValue).length;
    }
  } catch(e) {}

  pendingRename = { field, oldValue, newValue, inputEl: input };
  document.getElementById('confirm-rename-body').innerHTML =
    `Rename <strong>"${escHtml(oldValue)}"</strong> to <strong>"${escHtml(newValue)}"</strong>?
    ${matchCount > 0 ? `<br><br>This will also update <strong>${matchCount} match${matchCount !== 1 ? 'es' : ''}</strong> in your Match Log.` : ''}`;
  document.getElementById('confirm-rename').classList.add('visible');
}

async function confirmRename() {
  closeConfirm('confirm-rename');
  if (!pendingRename) return;
  const { field, oldValue, newValue, inputEl } = pendingRename;
  pendingRename = null;
  try {
    const res  = await fetch(webAppUrl, { method:'POST', body: JSON.stringify({ action:'renameValidEntry', field, oldValue, newValue }) });
    const data = await res.json();
    if (!data.success) throw new Error(data.error);
    const idx = (entries[field] || []).indexOf(oldValue);
    if (idx !== -1) entries[field][idx] = newValue;
    render();
    const updated = data.matchesUpdated > 0 ? ` (${data.matchesUpdated} match${data.matchesUpdated !== 1 ? 'es' : ''} updated)` : '';
    showToast(`Renamed to "${newValue}"${updated}`);
  } catch(e) { showToast('Rename failed: ' + e.message, true); }
}

function cancelRename() {
  closeConfirm('confirm-rename');
  if (pendingRename) {
    pendingRename.inputEl.value = pendingRename.oldValue;
    pendingRename = null;
  }
  render();
}

// ── Delete entry ───────────────────────────────────────────
function triggerDelete(field, value) {
  pendingDelete = { field, value };
  document.getElementById('confirm-delete-body').innerHTML =
    `Delete <strong>"${escHtml(value)}"</strong> from ${FIELD_LABELS[field]}?
    <br><br>This won't affect existing matches that already use this value, but it will no longer appear in dropdowns.`;
  document.getElementById('confirm-delete').classList.add('visible');
}

async function confirmDelete() {
  closeConfirm('confirm-delete');
  if (!pendingDelete) return;
  const { field, value } = pendingDelete;
  pendingDelete = null;
  try {
    const res  = await fetch(webAppUrl, { method:'POST', body: JSON.stringify({ action:'deleteValidEntry', field, value }) });
    const data = await res.json();
    if (!data.success) throw new Error(data.error);
    entries[field] = (entries[field] || []).filter(v => v !== value);
    render();
    showToast(`Deleted "${value}"`);
  } catch(e) { showToast('Delete failed: ' + e.message, true); }
}

function closeConfirm(id) { document.getElementById(id).classList.remove('visible'); }

// ── Helpers ────────────────────────────────────────────────
function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function showToast(msg, isError=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '');
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => t.classList.remove('show'), 3200);
}
</script>
